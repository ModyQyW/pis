name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Go build, vet, and test
        run: |
          packages=$(go list ./... | grep -v /node_modules/)
          go build $packages
          go vet $packages
          go test $packages

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
          - darwin/arm64
          - darwin/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile ${{ matrix.target }}
        run: |
          export GOOS="${TARGET%/*}"
          export GOARCH="${TARGET#*/}"
          export CGO_ENABLED=0
          go build $(go list ./... | grep -v /node_modules/)
        env:
          TARGET: ${{ matrix.target }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run check:web
      - run: bun run test:bridge
      - run: bun run test
      - run: bun run build:web
      - run: bun run docs:build

  package-macos:
    runs-on: macos-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Build ad-hoc macOS apps (arm64 + amd64)
        run: go tool mygo build -platform "darwin/arm64,darwin/amd64"
      - uses: actions/upload-artifact@v7
        with:
          name: pis-macos
          path: build/**
          if-no-files-found: error
