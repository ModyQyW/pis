name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/arm64
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: windows-2025
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Resolve version
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          echo "PI_MYGO_VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Build app
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PI_MYGO_UPDATE_PUBLIC_KEY: ${{ vars.PI_MYGO_UPDATE_PUBLIC_KEY }}
          PI_MYGO_UPDATE_URL: ${{ vars.PI_MYGO_UPDATE_URL }}
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: pi-mygo-${{ strategy.job-index }}
          path: build/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**
