name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          generate_release_notes: true

  build:
    needs: draft
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: "darwin/arm64,darwin/amd64"
          - name: Windows
            os: ubuntu-latest
            platform: "windows/amd64,windows/arm64"
          - name: Linux
            os: ubuntu-latest
            platform: "linux/amd64,linux/arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Resolve version
        shell: bash
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          echo "PIS_VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Verify update signing configuration
        shell: bash
        env:
          PIS_UPDATE_PUBLIC_KEY: ${{ vars.PIS_UPDATE_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$PIS_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::Set the repository variable PIS_UPDATE_PUBLIC_KEY (from scripts/update-keygen.sh)."
            exit 1
          fi
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Set the repository secret MYGO_UPDATER_PRIVATE_KEY."
            exit 1
          fi
      - name: Build and upload ${{ matrix.name }} artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PIS_UPDATE_PUBLIC_KEY: ${{ vars.PIS_UPDATE_PUBLIC_KEY }}
          PIS_UPDATE_GITHUB: ${{ vars.PIS_UPDATE_GITHUB || github.repository }}
        run: ./scripts/release.sh -platform "${{ matrix.platform }}" -upload
      - uses: actions/upload-artifact@v7
        with:
          name: pis-${{ matrix.name }}
          path: build/**
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List release artifacts
        run: |
          find artifacts -type f | sort
          test -n "$(find artifacts -type f -print -quit)"
